image: python:3.10.16

stages:
  - deploy

before_script:
  - pip install --upgrade pip

pages:
  stage: deploy
  script:
    - pip install -r requirements.txt
    - python -m src.renderer
    - rendercv render intermediate/cv.yml
    - mkdir -p public
    - cp -r rendercv_output/* public/
    - cp cv.html public/index.html
  
  artifacts:
    paths:
      - public