name: Deploy Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Upgrade pip
        run: pip install --upgrade pip
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run build script
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main

      - name: Build docs site
        env:
          # The custom domain (uldr.fr) serves the site at the root, so the
          # base is `/` regardless of the repository name.
          VITEPRESS_BASE: /
        run: npm run docs:build
      
      - name: Prepare public directory
        run: |
          mkdir -p public
          # The VitePress CV site owns the root: `/` is French, `/en/` is English.
          cp -r docs/.vitepress/dist/. public/

          # PDF renderings live alongside, under the locale paths: `/en/` and `/fr/`.
          cp build/rendercv_output/Ulysse_Durand_CV.pdf public/en/Ulysse_Durand_CV.pdf
          cp build/rendercv_output_fr/Ulysse_Durand_CV.pdf public/fr/Ulysse_Durand_CV.pdf

          cp -r build/repos_images public/
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
