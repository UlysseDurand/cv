courses:
  l3:
    description_fr: "L3 Informatique Fondamentale ENS Lyon"
    description: "L3 Fundamental Computer Science ENS Lyon"
    location: "ENS Lyon"
    year: 2022-2023
    courses:
      - name_fr: "Algorithmique 1"
        name: "Algorithms 1"
        description: "Algorithm design and analysis, data structures, complexity classes"
        description_fr: "Design et analyse d'algorithmes, structures de données, classes de complexité"
        teachers:
          - "Stéphan Thomassé"
      - name_fr: "Fondements de l'informatique"
        name: "Foundations of theorerical computer science"
        description: "Finite automata, formal languages, Turing machines, computability, lambda calculus, and computational complexity"
        description_fr: "Automates finis, langages formels, machines de Turing, calculabilité, lambda-calcul et complexité algorithmique"
        teachers:
          - "Pascal Koiran"
      - name_fr: "Théorie de la programmation"
        name: "Theory of Programming languages"
        description: "Inductive definitions, semantics of programming languages, rewriting and unification, type systems, and program verification"
        description_fr: "Définitions inductives, sémantique des langages de programmation, réécriture et unification, systèmes de types et vérification de programmes"
        teachers:
          - "Daniel Hirschkoff"
      - name_fr: "Programmation"
        name: "Programming"
        description: "Various programming languages, Python, C, C++, Haskell"
        description_fr: "Divers langages de programmation, Python, C, C++, Haskell"
        teachers:
          - "Eddy Caron"
      - name_fr: "Algorithmique 2"
        name: "Algorithms 2"
        description: "Advanced algorithm design and analysis, data structures, graph algorithms, complexity analysis, and string algorithms"
        description_fr: "Conception et analyse avancées d'algorithmes, structures de données, algorithmes de graphes, analyse de complexité et algorithmes sur les chaînes de caractères"
        teachers:
          - "Anne Benoit"
          - "Yves Robert"
      - name_fr: "Logique"
        name: "Logic"
        description_fr: "Logique mathématique, systèmes de preuve, théorèmes d’incomplétude de Gödel, théorie des ensembles, théorie des modèles"
        description: "Mathematical logic, proof systems, Gödel's incompleteness theorems, set theory, model theory"
        teachers:
          - "Natacha Portier"
      - name_fr: "Programmation Fonctionnelle"
        name: "Functional Programming"
        description_fr: "Création d'un interpréteur OCaml en OCaml, lambda-calcul, typage, correspondance de Curry-Howard"
        description: "Building an OCaml interpreter in OCaml, lambda calculus, typing, Curry-Howard correspondence"
        teachers:
          - "Daniel Hirschkoff"
      - name_fr: "Probabilités"
        name: "Probability"
        description: "Probabilistic algorithms, Markov chains"
        description_fr: "Algorithmes probabilistes, chaines de Markov"
        teachers:
          - "Yves Robert"
  m1_ens:
    description_fr: "M1 Informatique concepts et applications"
    description: "M1 Computer Science: Concepts and Applications"
    location: "ENS Lyon"
    year: 2023-2024
    courses:
      - name_fr: "Projet intégré"
        name: "Project"
        teachers:
          - "Michael Rao"
        description_fr: "Projet de programmation en groupe, planificateur de randonnée à partir des données [LidarHD](https://www.ign.fr/institut/programme-lidar-hd-vers-une-nouvelle-cartographie-3d-du-territoire)"
        description: "Group programming project, hiking planner based on [LidarHD](https://www.ign.fr/institut/programme-lidar-hd-vers-une-nouvelle-cartographie-3d-du-territoire) data"
        links:
          Repository: "https://github.com/UlysseDurand/planirando"
          Report: "https://github.com/UlysseDurand/planirando/releases/download/report/report.pdf"
          Slides: "https://github.com/UlysseDurand/planirando/releases/download/slides/slides.pdf"
      - name_fr: "Algorithmique et Programmation Parallèles et Distribuées"
        name: "Parallel and Distributed Algorithms and Programming"
        description: "Theoretical models, MPI, sorting networks, PRAMs, algorithms on processor rings or grids, task graph scheduling"
        description_fr: "Modèles théoriques, MPI, réseaux de tri, PRAM, algorithmes sur anneaux ou grilles de processeurs, ordonnancement de graphes de tâches"
        teachers:
          - "Anne Benoit"
      - name_fr: "Informatique quantique"
        name: "Quantum Computer Science"
        description_fr: "Circuits quantiques, algorithmes basiques, implémentation"
        description: "Quantum circuits, basic algorithms, implementation"
        teachers:
          - "Daniel Stilck França"
      - name_fr: "Compilation et Analyse de Programmes"
        name: "Program Analysis and Compilation"
        description: "MiniC (subset of C) compiler to RISCV, lexical and syntactic analysis, typing, semantics, code optimisation and code generation, imperative languages, functional langages, abstract interpretation"
        description_fr: "Compilateur MiniC (sous-ensemble du C) vers RISCV, analyse lexicale et syntaxique, typage, sémantique, optimisation et génération de code, langages impératifs, langages fonctionnels, interprétation abstraite"
        teachers:
          - "Gabriel Radanne"
          - "Ludovic Henrio"
      - name_fr: "Optimisation et Approximation"
        name: "Optimization and Approximation"
        description: "Convex and nonconvex optimization, optimality conditions, gradient descent, Newton method, quasi Newton methods, nonlinear least squares, constrained optimization, KKT"
        description_fr: "Optimisation convexe et non convexe, conditions d'optimalité, descente de gradient, méthode de Newton, méthodes quasi-Newton, moindres carrés non linéaires, optimisation sous contraintes, KKT"
        teachers:
          - "Stéphan Thomassé"
          - "Elisa Ricietti"
      - name_fr: "Sémantique et Vérification"
        name: "Semantics and Verification"
        description: "Modelling with Labelled Transition Systems, Linear-Time Properties, Stone Duality, Bisimulation and Modal Logic"
        description_fr: "Modélisation par systèmes de transitions étiquetés, propriétés linéaires temporelles, dualité de Stone, bisimulation et logique modale"
        teachers:
          - "Colin Riba"
          - "Ralph Sarkis"
      - name_fr: "Fundamentals of Machine Learning"
        name: "Fundamentals of Machine Learning"
        teachers:
          - "Elisa Ricietti"
          - "Titouan Vayer"
      - name_fr: "Preuves et Programmes"
        name: "Proofs and Programs"
        description: "Curry-Howard correspondence, simply typed λ-calculus, intuitionistic propositional natural deduction, continuations and classical logic, polymorphism, second-order logic, System F, Rocq labs"
        description_fr: "Correspondance de Curry-Howard, λ-calcul simplement typé, déduction naturelle propositionnelle intuitionniste, continuations et logique classique, polymorphisme, logique du second ordre, Système F, travaux pratiques Rocq"
        teachers:
          - "Michele Angelo Pagani"
      - name_fr: "Informatique Graphique et Images Numériques"
        name: "Computer Graphics and Digital Imagery"
        description: "Histogram manipulation, fourier analysis, implicit surfaces, manifolds, normal estimation, laplace beltrami operator"
        description_fr: "Manipulation d'histogrammes, analyse de Fourier, surfaces implicites, variétés, estimation de normales, opérateur de Laplace-Beltrami"
        teachers:
          - "Vincent Nivoliers"
          - "David Coeurjolly"
  m1_ecl:
    description_fr: "Ingénieur généraliste"
    description: "Generalist Engineering"
    location: "Centrale Lyon"
    year: 2024-2025
    courses:
      - name_fr: "Génie mécanique"
        name: "Mechanical Engineering"
      - name_fr: "Mécanique des Solides et des Structures"
        name: "Mechanics of Solids and Structures"
      - name_fr: "Applications concurrentes, mobiles et réparties en Java"
        name: "Concurrent, Mobile and Distributed Applications in Java"
      - name_fr: "Sciences Humaines et Sociales"
        name: "Human and Social Sciences"
        description_fr: "Individus et société, Travailler aujourd'hui, Ethique"
        description: "Individuals and society, Working today, Ethics"
      - name_fr: "Projet d'Application Industrielle"
        name: "Industrial Application Project"
        description_fr: "Logiciel de CAO en réalité virtuelle conçu en équipe de 7, commandité par ASSYSTEM"
        description: "Virtual reality CAD software designed in a team of 7, sponsored by ASSYSTEM"
      - name_fr: "Programmation d'interfaces graphiques en C++"
        name: "Graphical User Interface Programming in C++"
      - name_fr: "Systèmes d'Information Géographique"
        name: "Geographic Information Systems"
      - name_fr: "Capteurs et Traitement d'images"
        name: "Sensors and Image Processing"
      - name_fr: "Applications Web"
        name: "Web Applications"
      - name_fr: "Finance d'entreprise"
        name: "Enterprise Finance"
  m2:
    description_fr: "ENS: M2 Informatique Concepts et Applications, ECL: Ingénieur logiciel"
    description: "ENS: M2 Computer Science Concepts and Applications, ECL: Software Engineer"
    location: "ENS Lyon & Centrale Lyon"
    year: 2025-2026
    courses:
      - name_fr: "Modèles génératifs"
        name: "Generative Modelling"
        description_fr: "Gaussian Mixture Model, VAE, GAN, WGAN, Flow Matching, Diffusion, implémentation de VAR avec distance de Wasserstein"
        description: "Gaussian Mixture Model, VAE, GAN, WGAN, Flow Matching, Diffusion, VAR implementation with Wasserstein distance"
        teachers:
          - "Mathurin Massias"
          - "Quentin Bertrand"
      - name_fr: "Arithmétique des nombres flottants"
        name: "Floating Point Arithmetic"
        description_fr: "IEE754, preuve formelle sur les flottants, circuits, FMA, précision mixte, flottants multi-mots"
        description: "IEE754, formal proof with floats, circuits, FMA, mixed precision, multiword floats"
        teachers:
          - "Jean-Michel Muller"
          - "Guillaume Melquiond"
          - "Claude-Pierre Jeannerod"
      - name_fr: "Calculs sur CPU et GPU"
        name: "Resource Aware Computations on CPUs & GPUs"
        description_fr: "Red-Blue Pebble games, architecture des GPU NVidia, intensité algorithmique, modèle roofline, programmation Cuda"
        description: "Red-Blue Pebble games, NVidia GPUs architecture, algorithmic intensity, roofline model, Cuda programming"
        teachers:
          - "Suraj Kumar"
          - "Loris Marchal"
          - "Frédéric Vivien"
      - name_fr: "Preuves assistées par ordinateur"
        name: "Computer-Assisted Proofs"
        description: "Interval Arithmetic, Disk packings, Four color theorem, Wang tiles"
        description_fr: "Arithmétique par intervalles, empilements de disques, théorème des quatre couleurs, pavages de Wang"
        teachers:
          - "Daria Pchelina"
          - "Nathalie Revol"
          - "Damien Pous"
          - "Michael Rao"
      - name_fr: "Graphes, Machines et Logiques"
        name: "Graphs, Machines & Logics"
        description: "Automata on finite and infinite words, Monadic-Second Order Logic, Linear Temporal Logic, Monoids, Courcelle’s theorem, Graph Neural Networks"
        description_fr: "Automates sur les mots finis et infinis, logique monadique du second ordre, logique temporelle linéaire, monoïdes, théorème de Courcelle, réseaux de neurones sur graphes"
        teachers:
          - "Edouard Bonnet"
          - "Denis Kuperberg"
          - "Stéphan Thomassé"
          - "François Schwarzentruber"
      - name_fr: "Systèmes embarqués et traitement du signal audio"
        name: "Embedded Audio Signal Processing"
        description: "Audio signal processing, Faust programming language, RTOS, music reacting LED garland project"
        description_fr: "Traitement du signal audio, langage de programmation Faust, RTOS, projet de guirlande LED réagissant à la musique"
        teachers:
          - "Tanguy Risset"
          - "Romain Michon"
      - name_fr: "Nouvelles Technologies de l'Information et de la Communication"
        name: "New Information and Communication Technologies"
      - name_fr: "Systèmes d'information en entreprise"
        name: "Enterprise Information Systems"
      - name_fr: "Informatique Graphique"
        name: "Computer Graphics"
        description: "Ray Tracing, BRDF, Monte-Carlo estimators, Bounding Volume Hierarchy"
        description_fr: "Lancer de rayons, BRDF, estimateurs de Monte-Carlo, hiérarchie de volumes englobants"
        teachers:
          - "Jean Claude Iehl"
      - name_fr: "Technologies Informatique du Big Data"
        name: "Big Data Information Technologies"
      - name_fr: "Apprentissage par renforcement"
        name: "Reinforcement Learning"
      - name_fr: "Vision par ordinateur"
        name: "Computer Vision"
      - name_fr: "Calcul et Modélisation géométrique pour l'informatique graphique"
        name: "Geometric Modeling and Computation"
        description: "Mesh traversal, Laplace-Beltrami operator, Delaunay triangulation"
        description_fr: "Parcours de maillages, opérateur de Laplace-Beltrami, triangulation de Delaunay"
        teachers:
          - "Raphaëlle Chaine"
      - name_fr: "Projet Informatique"
        name: "Project"
        description_fr: "Monitoring des températures dans des salles de cours avec HomeAssistant"
        description: "Temperature monitoring in classrooms with HomeAssistant"
